# .github/workflows/deploy-dbt-docs.yml
#
# Builds dbt docs from the latest main branch and publishes them to GitHub Pages.
# Final URL: https://<your-username>.github.io/medflow/

name: Deploy dbt Docs

on:
  push:
    branches: [main]
    paths:
      - 'transformation/**'
      - '.github/workflows/deploy-dbt-docs.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build dbt Docs
    runs-on: ubuntu-latest

    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      DBT_PROFILES_DIR: .
      DBT_TARGET: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install dbt packages
        working-directory: transformation/medflow_dbt
        run: uv run dbt deps

      - name: dbt parse + compile
        working-directory: transformation/medflow_dbt
        run: |
          uv run dbt parse
          uv run dbt compile --target dev

      - name: Generate dbt docs
        working-directory: transformation/medflow_dbt
        run: uv run dbt docs generate --target dev

      - name: Generate dbt profiles.yml for CI
        working-directory: transformation/medflow_dbt
        run: |
          cat > profiles.yml << 'EOF'
          medflow_dbt:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: "md:medflow?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
                schema: staging
                threads: 4
                extensions:
                  - httpfs
                  - parquet
          EOF

      - name: Prepare docs for Pages
        run: |
          mkdir -p _site
          cp transformation/medflow_dbt/target/index.html _site/index.html
          cp transformation/medflow_dbt/target/manifest.json _site/manifest.json
          cp transformation/medflow_dbt/target/catalog.json _site/catalog.json
          cp transformation/medflow_dbt/target/run_results.json _site/run_results.json 2>/dev/null || true
          cp transformation/medflow_dbt/target/graph.gpickle _site/graph.gpickle 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4